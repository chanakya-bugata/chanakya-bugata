="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle><g class="rise" style="animation-delay:0.0s"><text x="50" y="70" class="kick">01 — EVERY DAY</text><text x="50" y="120" class="h2">A normal day, step by step</text><text x="50" y="154" class="sub">The same loop, from first idea to a system that keeps running.</text></g><path d="M100 338 L900 338" stroke="#8B5CF6" stroke-opacity=".5" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round" fill="none"><animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2s" repeatCount="indefinite"/></path><circle r="6" fill="#fff" filter="url(#soft)"><animateMotion path="M100 338 L900 338" dur="6s" repeatCount="indefinite"/></circle><circle r="3" fill="#fff"><animateMotion path="M100 338 L900 338" dur="6s" repeatCount="indefinite"/></circle><g transform="translate(100,270)"><ellipse cx="0" cy="35.0" rx="44" ry="11" fill="#22D3EE" opacity=".35" filter="url(#soft)" class="sh" style="animation-delay:0.0s"/><g class="fl" style="animation-delay:0.0s"><polygon points="-42,-46 0,-25.0 0,21.0 -42,0" fill="url(#cl0)"/><polygon points="42,-46 0,-25.0 0,21.0 42,0" fill="url(#cr0)"/><polygon points="0,-67.0 42,-46 0,-25.0 -42,-46" fill="url(#ct0)"/><polyline points="-42,-46 0,-25.0 42,-46" fill="none" stroke="#fff" stroke-opacity=".5"/><line x1="0" y1="-25.0" x2="0" y2="21.0" stroke="#fff" stroke-opacity=".35"/><text x="0" y="-41" text-anchor="middle" class="num">01</text></g></g><g transform="translate(260,270)"><ellipse cx="0" cy="35.0" rx="44" ry="11" fill="#8B5CF6" opacity=".35" filter="url(#soft)" class="sh" style="animation-delay:0.5s"/><g class="fl" style="animation-delay:0.5s"><polygon points="-42,-46 0,-25.0 0,21.0 -42,0" fill="url(#cl1)"/><polygon points="42,-46 0,-25.0 0,21.0 42,0" fill="url(#cr1)"/><polygon points="0,-67.0 42,-46 0,-25.0 -42,-46" fill="url(#ct1)"/><polyline points="-42,-46 0,-25.0 42,-46" fill="none" stroke="#fff" stroke-opacity=".5"/><line x1="0" y1="-25.0" x2="0" y2="21.0" stroke="#fff" st