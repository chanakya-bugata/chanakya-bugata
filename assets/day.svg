t></g></g><g transform="translate(900,270)"><ellipse cx="0" cy="35.0" rx="44" ry="11" fill="#38BDF8" opacity=".35" filter="url(#soft)" class="sh" style="animation-delay:2.5s"/><g class="fl" style="animation-delay:2.5s"><polygon points="-42,-46 0,-25.0 0,21.0 -42,0" fill="url(#cl5)"/><polygon points="42,-46 0,-25.0 0,21.0 42,0" fill="url(#cr5)"/><polygon points="0,-67.0 42,-46 0,-25.0 -42,-46" fill="url(#ct5)"/><polyline points="-42,-46 0,-25.0 42,-46" fill="none" stroke="#fff" stroke-opacity=".5"/><line x1="0" y1="-25.0" x2="0" y2="21.0" stroke="#fff" stroke-opacity=".35"/><text x="0" y="-41" text-anchor="middle" class="num">06</text></g></g><g class="rise" style="animation-delay:0.2s"><text x="100" y="372" text-anchor="middle" class="st-t" fill="#22D3EE">Analyse</text><text x="100" y="400" text-anchor="middle" class="st-d">Read the numbers,</text><text x="100" y="422" text-anchor="middle" class="st-d">logs and needs to</text><text x="100" y="444" text-anchor="middle" class="st-d">find what matters</text></g><g class="rise" style="animation-delay:0.32s"><text x="260" y="372" text-anchor="middle" class="st-t" fill="#8B5CF6">Design</text><text x="260" y="400" text-anchor="middle" class="st-d">Plan the data, the</text><text x="260" y="422" text-anchor="middle" class="st-d">screens and how</text><text x="260" y="444" text-anchor="middle" class="st-d">they connect</text></g><g class="rise" style="animation-delay:0.44s"><text x="420" y="372" text-anchor="middle" class="st-t" fill="#F472B6">Build</text><text x="420" y="400" text-anchor="middle" class="st-d">Write clean web,</text><text x="420" y="422" text-anchor="middle" class="st-d">mobile and backend</text><text x="420" y="444" text-anchor="middle" class="st-d">code</text></g><g class="rise" style="animation-delay:0.56s"><text x="580" y="372" text-anchor="middle" class="st-t" fill="#A3E635">Test</text><text x="580" y="400" text-anchor="middle" class="st-d">Automated checks</text><text x="580" y="422" text-anchor="middle" class="st-d">catch bugs before</text><text x="580" y="444" text-anchor="middle" class="st-d">anyone sees them</text></g><g class="rise" style="animation-delay:0.6799999999999999s"><text x="740" y="372" text-anchor="middle" class="st-t" fill="#FB923C">Ship</text><text x="740" y="400" text-anchor="middle" class="st-d">Release safely</text><text x="740" y="422" text-anchor="middle" class="st-d">through automated</text><text x="740" y="444" text-anchor="middle" class="st-d">pipelines</text></g><g class="rise" style="animation-delay:0.8s"><text x="900" y="372" text-anchor="middle" class="st-t" fill="#38BDF8">Monitor</text><text x="900" y="400" text-anchor="middle" class="st-d">Watch jobs that run</text><text x="900" y="422" text-anchor="middle" class="st-d">on a schedule and</text><text x="900" y="444" text-anchor="middle" class="st-d">fix anything off</text></g><rect x=".5" y=".5" width="999" height="519" rx="28" fill="none" stroke="#fff" stroke-opacity=".08"/></svg>