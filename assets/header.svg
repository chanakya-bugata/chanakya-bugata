<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5A36"/><stop offset=".55" stop-color="#FF9E3D"/><stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <clipPath id="c"><rect width="1200" height="280" rx="22"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
  </defs>
  <style>
    .n{font:italic 700 74px Georgia,'Times New Roman',serif;fill:url(#ember)}
    .s{font:500 20px 'SF Mono',Menlo,Consolas,monospace;fill:#9AA4B2}
    .k{font:600 13px 'SF Mono',Menlo,Consolas,monospace;fill:#5EEAD4;letter-spacing:3px}
    .r{opacity:0;animation:cy 12s infinite}.r2{animation-delay:3s}.r3{animation-delay:6s}.r4{animation-delay:9s}
    @keyframes cy{0%{opacity:0;transform:translateY(8px)}4%,22%{opacity:1;transform:none}27%,100%{opacity:0}}
    .cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
    .o1{animation:d1 14s ease-in-out infinite alternate}.o2{animation:d2 17s ease-in-out infinite alternate}
    @keyframes d1{to{transform:translate(260px,30px)}}@keyframes d2{to{transform:translate(-300px,-20px)}}
    .sc{animation:sc 6s linear infinite}@keyframes sc{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="280" fill="#0B0E14"/>
    <rect width="1200" height="280" fill="url(#grid)"/>
    <g filter="url(#blur)">
      <circle class="o1" cx="180" cy="90" r="120" fill="#FF5A36" fill-opacity=".55"/>
      <circle class="o2" cx="980" cy="220" r="130" fill="#FFB347" fill-opacity=".38"/>
      <circle class="o1" cx="700" cy="20" r="80" fill="#2DD4BF" fill-opacity=".22"/>
    </g>
    <rect class="sc" y="0" width="2" height="280" fill="#FFD166" fill-opacity=".25"/>
    <text class="k" x="70" y="88">● AVAILABLE · BUILDING IN PUBLIC</text>
    <text class="n" x="66" y="168">Chanakya Bugata</text>
    <g class="s" transform="translate(70,222)">
      <text class="r">full-stack engineer — web, mobile &amp; APIs</text>
      <text class="r r2">AI products that ship, not demo</text>
      <text class="r r3">fintech · legal-tech · skincare · civic-tech</text>
      <text class="r r4">building NamaCart with the team</text>
      <text class="cur" x="520">▍</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="279" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
