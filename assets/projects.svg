<style>.t{font:700 26px Georgia,serif;fill:#F4F1EA}.h{font:600 12px 'SF Mono',Menlo,Consolas,monospace;letter-spacing:2.5px}.d{font:400 15px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#9AA4B2}.m{font:500 12px 'SF Mono',Menlo,Consolas,monospace;fill:#6B7686}.num{font:italic 700 56px Georgia,serif;fill:#fff;fill-opacity:.05}
