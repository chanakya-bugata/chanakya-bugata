<!doctype html>
<meta charset="utf-8">
<title>Chanakya Bugata — reel</title>
<style>
  html, body { margin: 0; background: #05060A; overflow: hidden; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; color: #F4F5F9;
           font-family: 'Bahnschrift', 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; }
  canvas#gl { position: absolute; inset: 0; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  .a { position: absolute; white-space: nowrap; will-change: transform, opacity; opacity: 0; }
  .mono { font-family: 'Cascadia Code', 'Consolas', 'JetBrains Mono', monospace; }
  .kick { font-size: 20px; letter-spacing: 9px; color: #22D3EE; font-weight: 700; }
  .h2 { font-size: 70px; font-weight: 700; letter-spacing: -2px; line-height: 1; }
  .sub { font-size: 25px; color: #9AA3B5; }
  .mask { overflow: hidden; padding: 4px 0; }
  .grad { background: linear-gradient(100deg, #8B5CF6, #22D3EE, #F472B6, #8B5CF6); background-size: 300% 100%;
          -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lbl-t { font-size: 36px; font-weight: 700; letter-spacing: -.5px; }
  .lbl-d { font-size: 22px; color: #B6BFD0; line-height: 1.3; white-space: normal; width: 270px; margin-top: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px; border-radius: 999px;
          background: rgba(10,12,20,.72); border: 1px solid rgba(255,255,255,.16); font-size: 22px; font-weight: 600;
          backdrop-filter: blur(4px); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .hud { font-size: 15px; letter-spacing: 3px; color: #9AA3B5; }
</style>
<div id="stage"><canvas id="gl" width="1280" height="720"></canvas><div id="ui"></div></div>
